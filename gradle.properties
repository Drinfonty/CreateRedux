# Per-branch build configuration.
#
# Everything in this file is Minecraft-version specific and is NEVER merged from
# the `main` branch. Version-agnostic values live in gradle/mod.properties.

# Gradle Memory Settings
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.14.10

# Toolchain
java_version=21
mixin_compat_level=JAVA_21

# Mod Properties
mc_version_suffix=mc1.21.11
minecraft_dependency=>=1.21.11 <1.22.0
# NeoForge parses Maven version ranges, not SemVer - the two formats are not interchangeable.
minecraft_dependency_maven=[1.21.11,1.22)
fabric_loader_dependency=>=0.15.0
neoforge_version=21.11.45
neoforge_dependency=[21.11.0,)

# Dependencies
fabric_api_version=0.141.4+1.21.11
modmenu_version=11.0.1
flywheel_version=1.0.6
ponder_version=1.0.85

# Modrinth Automation
modrinth_game_versions=1.21.11

# CurseForge Automation
curseforge_game_versions=1.21.11
